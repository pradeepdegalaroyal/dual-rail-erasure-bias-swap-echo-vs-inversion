[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erasure-echo"
version = "0.1.0"
description = "Erasure-postselected dual-rail memory: non-Hermitian loss-asymmetry bias, swap echo and classical inversion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Degala Chenchupradeep"}]
dependencies = ["numpy", "scipy", "pandas", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
